name: Build iOS App (Cloud Mac)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mobile/flutter_app/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    name: Build iOS Package on GitHub Mac Runner
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Precache iOS Artifacts & Dependencies
        working-directory: mobile/flutter_app
        run: |
          flutter precache --ios
          flutter pub get

      - name: Build iOS App (.app Bundle)
        working-directory: mobile/flutter_app
        run: |
          flutter build ios --no-codesign --release

      - name: Package .ipa File
        working-directory: mobile/flutter_app
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r GTech-Fleet-iOS.ipa Payload

      - name: Upload iOS App Artifact (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: GTech-Fleet-iOS-App
          path: mobile/flutter_app/build/ios/iphoneos/GTech-Fleet-iOS.ipa
          retention-days: 14
