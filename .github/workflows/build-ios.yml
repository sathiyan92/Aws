name: Build iOS App (Cloud Mac)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mobile/flutter_app/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    name: Build iOS Package on GitHub Mac Runner
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Precache iOS Artifacts & Dependencies
        working-directory: mobile/flutter_app
        run: |
          flutter precache --ios
          flutter pub get

      - name: Build iOS App (.app Bundle)
        working-directory: mobile/flutter_app
        run: |
          flutter build ios --config-only --release
          xcodebuild build \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            -derivedDataPath build/DerivedData

      - name: Package .ipa File
        working-directory: mobile/flutter_app
        run: |
          mkdir -p Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r -y GTech-Fleet-iOS.ipa Payload

      - name: Upload iOS App Artifact (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: GTech-Fleet-iOS-App
          path: mobile/flutter_app/GTech-Fleet-iOS.ipa
          retention-days: 14
