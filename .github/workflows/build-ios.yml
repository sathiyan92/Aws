name: Build iOS App (Cloud Mac)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mobile/flutter_app/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    name: Build iOS Package on GitHub Mac Runner
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Precache iOS Artifacts & Dependencies
        working-directory: mobile/flutter_app
        run: |
          flutter precache --ios
          flutter pub get

      - name: Build iOS App (.app Bundle)
        working-directory: mobile/flutter_app
        run: |
          set -o pipefail
          flutter build ipa --release --no-codesign 2>&1 | tee build_ios.log

      - name: Package .ipa File
        working-directory: mobile/flutter_app
        run: |
          mkdir -p Payload
          if [ -d "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" ]; then
            cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app Payload/
          elif [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -r build/ios/iphoneos/Runner.app Payload/
          fi
          zip -r -y GTech-Fleet-iOS.ipa Payload

      - name: Upload iOS App Artifact (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: GTech-Fleet-iOS-App
          path: mobile/flutter_app/GTech-Fleet-iOS.ipa
          retention-days: 14

      - name: Report Build Error on Failure
        if: failure()
        run: |
          echo "### iOS Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 100 mobile/flutter_app/build_ios.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
