; PlatformIO Project Configuration File for Multi-Tenant Cloud IoT Platform
; Embedded ESP32 Firmwares: Vending Machine & RFID Attendance System

[platformio]
default_envs = esp32-vending, esp32-rfid

[env]
platform = espressif32 @ ~6.5.0
framework = espidf
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions_two_ota.csv

; ESP32-S3 Commercial Vending Machine Controller
[env:esp32-vending]
board = esp32-s3-devkitc-1
src_dir = esp32-vending/main
build_flags = 
    -I common/include
    -D PRODUCT_VENDING_MACHINE=1
    -D CORE_DEBUG_LEVEL=3

; ESP32-S3 Smart RFID Attendance Terminal
[env:esp32-rfid]
board = esp32-s3-devkitc-1
src_dir = esp32-rfid/main
build_flags = 
    -I common/include
    -D PRODUCT_RFID_ATTENDANCE=1
    -D CORE_DEBUG_LEVEL=3
